[package]
name = "ysm-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compile AI-generated character designs into portable YSM Spec 2 models"

[dependencies]
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "9.5", default-features = false }
